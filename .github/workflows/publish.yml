name: Publish printer status

# The collector on the Makerspace Surface sends a repository_dispatch "update-status"
# with the latest status as client_payload.status. This writes it to status.json
# (keeping only screen-safe fields) and republishes GitHub Pages.
# A push to main republishes the page and keeps the last live status.json.
# Self-heal: GitHub Pages sometimes reports a deploy as done but keeps serving an old copy
# (2026-11-17, 2026-11-18). Every dispatch deploy has the same name (the commit SHA), and a
# new commit clears it. So after each deploy this checks the live status.json, and if it is
# not the one just built, it commits a new time to .pages-nudge (at most once per 30 min).

on:
  repository_dispatch:
    types: [update-status]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the self-heal step commits .pages-nudge
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Build the site folder
        env:
          STATUS: ${{ toJson(github.event.client_payload.status) }}
          EVENT: ${{ github.event_name }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/status.json
        run: |
          mkdir -p _site
          cp -R site/. _site/
          # the live status.json carries ok_at (last healthy update) forward for the alert flow
          curl -fsSL "$PAGES_URL?_=$(date +%s)" -o last.json || echo '{"printers":[]}' > last.json
          if [ "$EVENT" = "repository_dispatch" ]; then
            printf '%s' "$STATUS" | python3 tools/clean_status.py last.json > _site/status.json
          else
            python3 tools/clean_status.py last.json < last.json > _site/status.json
          fi
          python3 -c "import json; d=json.load(open('_site/status.json')); print(len(d['printers']), 'printers, updated', d.get('updated'), 'ok_at', d.get('ok_at'))"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

      - uses: actions/deploy-pages@v4

      - name: Check that the live page changed (self-heal)
        if: github.event_name == 'repository_dispatch'
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/status.json
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 10
            if curl -fsSL "$PAGES_URL?_=$(date +%s)" -o live.json && cmp -s live.json _site/status.json; then
              echo "Live page matches this deploy."
              exit 0
            fi
          done
          echo "::warning::GitHub Pages did not serve this deploy after 60 s."
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -lt 1800 ]; then
            echo "Last commit was $age s ago. No new nudge yet."
            exit 0
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ > .pages-nudge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages-nudge
          git commit -m "Nudge a stuck Pages deployment"
          git push
          echo "Committed .pages-nudge. The next update deploys under a new name."

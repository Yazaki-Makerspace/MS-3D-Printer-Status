name: Publish printer status

# The collector on the Makerspace Surface sends a repository_dispatch "update-status"
# with the latest status as client_payload.status. This writes it to status.json
# (keeping only screen-safe fields) and republishes GitHub Pages.
# A push to main republishes the page and keeps the last live status.json.

on:
  repository_dispatch:
    types: [update-status]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Build the site folder
        env:
          STATUS: ${{ toJson(github.event.client_payload.status) }}
          EVENT: ${{ github.event_name }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/status.json
        run: |
          mkdir -p _site
          cp -R site/. _site/
          if [ "$EVENT" = "repository_dispatch" ]; then
            printf '%s' "$STATUS" | python3 tools/clean_status.py > _site/status.json
          else
            curl -fsSL "$PAGES_URL?_=$(date +%s)" -o last.json || echo '{"printers":[]}' > last.json
            python3 tools/clean_status.py < last.json > _site/status.json
          fi
          python3 -c "import json; d=json.load(open('_site/status.json')); print(len(d['printers']), 'printers, updated', d.get('updated'))"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

      - uses: actions/deploy-pages@v4
